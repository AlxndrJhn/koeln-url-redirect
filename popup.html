<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Köln Ratsinfo Redirect</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <h1>Köln Ratsinfo Redirect</h1>
    <label class="toggle">
      <input type="checkbox" id="enabled-toggle" />
      <span>Erweiterung aktiviert</span>
    </label>
    <div class="feedback">
      <a id="report-bug" class="feedback-link" data-kind="bug" href="https://ratsinformation.alex-360.com/feedback?type=bug&amp;source=extension" target="_blank" rel="noopener noreferrer">Fehler melden</a>
      ·
      <a id="report-idea" class="feedback-link" data-kind="idea" href="https://ratsinformation.alex-360.com/feedback?type=idea&amp;source=extension" target="_blank" rel="noopener noreferrer">Idee vorschlagen</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
