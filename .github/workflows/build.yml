name: Build extensions

# CI only: checks and builds every PR and every merge to main, but never
# releases. Releases are cut on demand by release.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          for f in manifest.json manifest.chrome.json rules.json; do
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Check manifest versions match
        run: |
          ff=$(jq -r .version manifest.json)
          cr=$(jq -r .version manifest.chrome.json)
          if [ "$ff" != "$cr" ]; then
            echo "::error::manifest.json ($ff) and manifest.chrome.json ($cr) versions differ"
            exit 1
          fi

      - name: Build extension packages
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox
          path: dist/koeln-ratsinfo-mirror-firefox.zip

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome
          path: dist/koeln-ratsinfo-mirror-chrome.zip
