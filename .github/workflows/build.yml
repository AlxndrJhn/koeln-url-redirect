name: Build extensions

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          for f in manifest.json manifest.chrome.json rules.json; do
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Build extension packages
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox
          path: dist/koeln-ratsinfo-mirror-firefox.zip

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome
          path: dist/koeln-ratsinfo-mirror-chrome.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build extension packages
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/koeln-ratsinfo-mirror-firefox.zip
            dist/koeln-ratsinfo-mirror-chrome.zip
